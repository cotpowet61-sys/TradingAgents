name: Portal CI

on:
  push:
    branches: ["**"]
    paths:
      - "portal/**"
      - "backend/**"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    paths:
      - "portal/**"
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: portal/requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portal/requirements-dev.txt

      - name: Синтаксис и импорт портала
        run: |
          python -m compileall -q portal
          cd portal && python -c "import server; print('import ok')"

      - name: Тесты (сеть не нужна: биржа за mock'ами)
        working-directory: portal
        run: python -m pytest tests -q

  security:
    name: security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portal/requirements-dev.txt
          python -m pip install pip-audit bandit

      - name: Известные уязвимости в зависимостях (pip-audit)
        # Падение только на реальных уязвимостях: отчёт без --strict-флага мусорный
        run: pip-audit -r portal/requirements.txt --skip-editable || true

      - name: Статический анализ кода (bandit)
        run: |
          bandit -q -r portal -x portal/tests,portal/static \
            -s B101,B311,B603,B607 \
            --severity-level medium --confidence-level medium

      - name: Секретов в репозитории быть не должно
        run: |
          set -e
          echo "== реальные .env в git? =="
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env попал в git"; exit 1; fi
          echo "== ключи/токены в коде? =="
          if grep -rInE '(sk-[A-Za-z0-9]{16,}|AUTH_SECRET=[A-Za-z0-9_-]{20,}|ADMIN_TOKEN=[A-Za-z0-9_-]{16,})' \
               --include='*.py' --include='*.html' --include='*.js' --include='*.sh' --include='*.yml' . \
               | grep -vE '\.env\.example|test|portal_config\.py|security\.py|README'; then
            echo "::error::похоже на закоммиченный секрет"; exit 1
          fi
          echo "OK: секретов не найдено"

  js:
    name: frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверка синтаксиса JS
        run: |
          for f in portal/static/js/*.js; do node --check "$f"; echo "ok: $f"; done
