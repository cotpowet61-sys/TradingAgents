services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - .env
    command: python main.py
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # --- TradeVision Portal (SaaS: подписка, кабинет, сигналы) ---------------
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "3005:3005"
    volumes:
      - ./portal/data:/data
    env_file:
      - ./portal/.env          # заполните по portal/.env.example
    environment:
      # TRUST_PROXY_HEADERS=false — если публикуете порт напрямую, без reverse-proxy
      TRUST_PROXY_HEADERS: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
